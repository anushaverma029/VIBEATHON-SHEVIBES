<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusCue Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="peony.png" type="image/x-icon">
</head>
<body style="background-image:url('flowers.jpg');background-size:cover;background-repeat:no-repeat;background-position:center;height:100vh;margin:0;">

    <header>
        <div class="logo">
            <img src="bunny.png" alt="CampusCue Logo">
        </div>
    </header>

    <nav><ul></ul></nav>

    <div class="login">

        <div class="login-tabs">
            <button type="button" class="tab-btn active" id="employeeTab">Admin</button>
            <button type="button" class="tab-btn" id="studentTab">Student</button>
        </div>

        <form id="employeeForm">
            <div class="input-box">
                <span class="icon"><ion-icon name="id-card-outline"></ion-icon></span>
                <input type="email" name="email" required>
                <label>Email</label>
            </div>
            <div class="input-box">
                <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
                <input type="password" name="password" required>
                <label>Password</label>
            </div>
            <div class="remember-forgot">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot Password?</a>
            </div>
            <div class="login-error" id="employeeError" style="color:#e33;font-size:0.9em;min-height:1.2em;"></div>
            <button type="submit">Login</button>
            <div class="register-link">
                <p>Don't have an account?</p>
                <a href="register.html">Register</a>
            </div>
        </form>

        <form id="studentForm" style="display:none;">
            <div class="input-box">
                <span class="icon"><ion-icon name="id-card-outline"></ion-icon></span>
                <input type="email" name="email" required>
                <label>Email</label>
            </div>
            <div class="input-box">
                <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
                <input type="password" name="password" required>
                <label>Password</label>
            </div>
            <div class="remember-forgot">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot Password?</a>
            </div>
            <div class="login-error" id="studentError" style="color:#e33;font-size:0.9em;min-height:1.2em;"></div>
            <button type="submit">Login</button>
            <div class="register-link">
                <p>Don't have an account?</p>
                <a href="register.html">Register</a>
            </div>
        </form>

    </div>

    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>

    <script>
        const API_BASE = "https://vibeathon-shevibes.onrender.com";
        const employeeForm = document.getElementById("employeeForm");
        const studentForm  = document.getElementById("studentForm");
        const employeeTab  = document.getElementById("employeeTab");
        const studentTab   = document.getElementById("studentTab");

        employeeTab.addEventListener("click", function () {
            employeeForm.style.display = "block";
            studentForm.style.display  = "none";
            employeeTab.classList.add("active");
            studentTab.classList.remove("active");
        });

        studentTab.addEventListener("click", function () {
            employeeForm.style.display = "none";
            studentForm.style.display  = "block";
            studentTab.classList.add("active");
            employeeTab.classList.remove("active");
        });

        async function handleLogin(form, errorElement, role) {
            const email    = form.querySelector('input[name="email"]').value.trim();
            const password = form.querySelector('input[name="password"]').value;
            errorElement.textContent = "";

            let response;
            try {
                response = await fetch(`${API_BASE}/api/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password, role })
                });
            } catch (networkError) {
                console.error("Connection error:", networkError);
                errorElement.textContent = "Cannot connect to the CampusCue server. Make sure Python Flask is running.";
                return;
            }

            let data;
            try { data = await response.json(); }
            catch (parseError) {
                errorElement.textContent = "Server returned an unexpected response.";
                return;
            }

           if (!response.ok) {
    errorElement.textContent = JSON.stringify(data);
    return;
}

            if (data.user) {
    sessionStorage.setItem("campuscue_user", JSON.stringify(data.user));
    localStorage.setItem("user", JSON.stringify(data.user));

    console.log("LOGIN USER:", data.user);
console.log("ROLE:", data.user.role);

if (data.user.role === "admin") {
    window.location.href = "dashboard%20(3).html";
} else {
    window.location.href = "Campus%20Cue-3.html";
}
}
            }

        employeeForm.addEventListener("submit", function (event) {
            event.preventDefault();
            handleLogin(employeeForm, document.getElementById("employeeError"), "admin");
        });

        studentForm.addEventListener("submit", function (event) {
            event.preventDefault();
            handleLogin(studentForm, document.getElementById("studentError"), "student");
        });
    </script>

</body>
</html>
